# Vision-Language Model Architectures Configuration

vision_encoder:
  backbone: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
  pretrained: true
  embed_dim: 768
  global_embed_dim: 512
  freeze_layers: true
  num_patches: 196

text_decoder:
  backbone: "google/flan-t5-base"
  pretrained: true
  vocab_size: 32128
  max_position_embeddings: 512
  hidden_size: 768
  num_attention_heads: 12
  num_hidden_layers: 12

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q", "v"]

multimodal_fusion:
  fusion_type: "visual_prefix_concatenation"
  projection_dim: 768
  dropout: 0.1

generation:
  max_new_tokens: 128
  min_length: 10
  do_sample: false
  num_beams: 2
  temperature: 1.0
  top_k: 50
  top_p: 0.95
  repetition_penalty: 1.2
  length_penalty: 1.0
  early_stopping: true

mock_vlm:
  vision_dim: 512
  text_dim: 256
  vocab_size: 1000
  max_seq_len: 128

