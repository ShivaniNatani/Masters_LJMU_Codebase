# Training Hyperparameters Configuration

hyperparameters:
  batch_size: 16
  eval_batch_size: 32
  num_epochs: 30
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

scheduler:
  type: "cosine_with_warmup" # Options: linear, cosine, step
  warmup_ratio: 0.1
  warmup_steps: 1000

optimizer:
  type: "AdamW"
  beta1: 0.9
  beta2: 0.999

hardware:
  device: "cuda" # Auto-detected: cuda / mps / cpu
  num_workers: 4
  pin_memory: true
  mixed_precision: "fp16" # Options: fp32, fp16, bf16
  seed: 42

checkpointing:
  save_dir: "checkpoints/"
  save_top_k: 3
  monitor_metric: "val_loss"
  mode: "min"
  save_every_n_epochs: 1
