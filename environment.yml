name: medical_vlm
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Regenerated 2026-07-26 to match the project's actual .venv (see requirements.txt
  # header for details). Pin pytorch-cuda to the CUDA toolkit actually present on
  # your training host - the value below is carried over unverified from the prior
  # pin and was not re-derived from the (CPU-only) dev venv.
  - python=3.14
  - pip=25.0
  - pytorch=2.13.0
  - torchvision=0.28.0
  - pytorch-cuda=12.1
  - numpy=2.5.1
  - pandas=2.3.3
  - scikit-learn=1.9.0
  - matplotlib=3.11.1
  - seaborn=0.13.2
  - pyyaml=6.0.3
  - tqdm=4.69.1
  - requests=2.34.2
  - pillow=12.3.0
  - pip:
    - transformers==5.14.1
    - tokenizers==0.22.2
    - faiss-cpu==1.14.3
    - opencv-python==5.0.0.93
    - wandb==0.28.1
    - mlflow==3.14.0
    - albumentations>=1.3.1
    - pytest==9.1.1
